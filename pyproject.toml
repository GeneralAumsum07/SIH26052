[project]
name = "vaani"
version = "0.1.0"
description = "SIH26052 - two-channel speech enhancement training stack"
requires-python = ">=3.12,<3.13"  # 3.12 pinned: pesq wheel in wheels/ is cp312 (no upstream Windows wheels)
dependencies = [
  "torch>=2.7",
  "torchaudio>=2.7",
  "numpy>=2.0",
  "scipy>=1.14",
  "soundfile>=0.12",
  "pyroomacoustics>=0.8",
  "pyarrow>=17",
  "pandas>=2.2",
  "pyyaml>=6",
  "pystoi>=0.4",
  "pesq>=0.0.4",
  "onnx>=1.16",
  "onnxruntime>=1.19",
  "tensorboard>=2.17",
  "tqdm>=4.66",
  "requests>=2.32",
  "einops>=0.8.2",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "pytest-timeout>=2.3"]
fast = ["numba>=0.60"]  # optional JIT path for vaani/dsp/nlms.py, falls back to pure numpy loop

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
pesq = { path = "wheels/pesq-0.0.4-cp312-cp312-win_amd64.whl" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vaani"]
