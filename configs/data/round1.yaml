# Round-1 lean data. Paths are relative to repo root.
raw_root: data/raw
manifest_dir: data/manifests
sources:
  librispeech:
    url: https://www.openslr.org/resources/12/train-clean-100.tar.gz
    extract_to: data/download/librispeech
    max_hours: 20
  esc50:
    # Real environmental noise for round 1 (labelled, 2000 x 5 s). Human-vocal classes are excluded.
    url: https://github.com/karolpiczak/ESC-50/archive/master.zip
    extract_to: data/download/esc50/ESC-50-master
  cv_hi:
    # Common Voice needs a logged-in download: drop the hi tar.gz at `archive`; fetch_data extracts it.
    archive: data/download/cv_hi.tar.gz
    extract_to: data/download/cv_hi/cv-corpus-27.0-2026-09-11/hi
    min_snr_db: 30
  mad:
    # https://github.com/kaen2891/military_audio_dataset -> MAD_dataset.zip (7468 wav, 2024-10-31 build).
    archive: data/download/mad.zip
    version: "MAD_dataset.zip, files dated 2024-10-31, downloaded 2026-09-18"
    extract_to: data/download/mad/MAD_dataset
  gunshots:
    # Zenodo 7004819, Kabealo et al. 2023 (Data in Brief), CC BY 4.0: 2,148 mono 44.1k WAV, four firearms,
    # recorded on Pi 3B+/Zero W + USB mics and phones. Run scripts/crest_audit.py before trusting it as a
    # clean transient; the plan expects it to serve the overload buckets first.
    url: https://zenodo.org/api/records/7004819/files/edge-collected-gunshot-audio.zip/content
    archive: data/download/gunshots/edge-collected-gunshot-audio.zip
    extract_to: data/download/gunshots/edge-collected-gunshot-audio
  drone:
    # DroneAudioDataset (Al-Emadi et al., IWCMC 2019): 1,332 ~1 s indoor multirotor clips (bebop, membo) + an
    # "unknown" class that is ESC-50/Speech Commands and is skipped. No licence file; the repo asks for the
    # IWCMC 2019 citation on use (Rachit accepted 2026-09-20) - cite "Audio Based Drone Detection and
    # Identification using Deep Learning" in the report.
    url: https://github.com/saraalemadi/DroneAudioDataset/archive/master.zip
    archive: data/download/drone/master.zip
    extract_to: data/download/drone/DroneAudioDataset-master
  ears:
    # EARS (Richter et al., Interspeech 2024), CC BY-NC 4.0, 48 kHz anechoic, 107 speakers x ~590 MB zips on GitHub
    # Releases: https://github.com/facebookresearch/ears_dataset/releases/download/dataset/pNNN.zip.
    # scripts/run_fetch_queue.sh pulls p001-p020; fetch_data scans whatever has landed.
    download_dir: data/download/ears
    extract_to: data/download/ears/extracted
  noisex92:
    # NOISEX-92 (D7, plan addendum 2026-09-20). Provenance: DRA Malvern 1992, mirrored by SPIB (spib.linse.ufsc.br,
    # .mat) and speechdnn/Noises (GitHub, .wav). The GitHub copies of leopard/m109/machinegun are 8 kHz/8-bit - those
    # three come from the SPIB .mat files instead. Redistribution terms unclear: cite Varga & Steeneken 1993, do not ship.
    dir: data/download/noisex92
