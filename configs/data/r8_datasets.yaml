# r8 dataset registry: what the rented box fetches, verifies, extracts and scans (scripts/r8_datasets.py).
# Human-readable table and box steps: configs/data/R8_DATASETS.md. Sources: the verified access table of 2026-09-26
# (URLs probed header-only; sizes are probed Content-Lengths or publisher metadata; md5/sha256 only where the
# publisher states one, otherwise null and `verify` records the sha256 of the first fetch in <dest>/.fetched).
#
# datasets: every corpus an r8 config (configs/retraining/r8_*.yaml, r8_ablations/*.yaml) or a box gate (G1 via
#           scripts/data_gates.py, G4) reads. scripts/r8_box_setup.sh fetches all of them (r8_preflight.py --fetch-order).
# hosts:    per-host download limits (max_files in flight, connections per file); r8_datasets.py applies them.
# optional: plan 11.5 candidates and eval re-render corpora. Same schema; fetched only when named with --only (or --all).
#
# Per entry (the interface other scripts read): access direct|login|request|manual; credentials = env vars that must be
# set (values never read from files); urls = landing pages; files[] = {name, url, size_bytes, md5 or sha256 (null when
# unpublished), mirrors?, laptop_sha256? (advisory: the laptop copy the laptop manifests came from)}; size_gb; dest =
# data/raw/<name>_src (archives + extracted tree; scanners write data/raw/<corpus>/ beside it, so manifest paths match
# the laptop's); extract none|tar|zip|zip_split|rar|mat2wav; root or root_find = the scanner root under dest; scanner =
# vaani.data.sources function (scans[] when one download feeds several manifests); manifest = what the configs name;
# needed_by = config stems, plus gate:/eval:/filter: tags.
# Paths are relative to the repo root with --root data (dest data/raw/x -> <root>/raw/x).
hosts:
  default: {max_files: 4, connections: 8}
  zenodo.org: {max_files: 2, connections: 1, note: 'polite: 2 files at a time, one connection each, 429 Retry-After honoured'}
  tulane.box.com: {max_files: 2, connections: 1, note: 'Box shared links: GET only, no HEAD'}
  spib.linse.ufsc.br: {max_files: 2, connections: 1, note: small academic server}
  www.kaggle.com: {max_files: 1, connections: 1, note: 302 to a signed URL}
  mozilladatacollective.com: {max_files: 1, connections: 4, note: 30 downloads/day per organisation}
