# Warm restart of the r6_e256 backbone: one new 64-epoch cosine cycle starting from its best
# checkpoint (the SGDR pattern the legacy chain used: r3_e32 -> r4_ctl, +32 epochs, gave +0.19 dB
# paired on eval_r2 n=617). Data, loss, DSP, model and optimiser settings are byte-identical to
# r6_e256; only the initial weights, the epoch budget, the seed (a fresh batch order for the new
# cycle) and the name change. init_sha256 pins the starting point.
# Launched by scripts/r7_run.sh after r6_e256_cascade scored 14.83 [14.53, 15.15] on eval_r2 (n=617).
amp: true
batch_size: 32
controller_on: true
data:
  bank: data/rirs/bank_r3.npz
  crop_s: 4.0
  epoch_len: 20000
  manifests:
  - data/manifests/librispeech_100h.parquet
  - data/manifests/ears.parquet
  - data/manifests/cv_hi.parquet
  - data/manifests/esc50.parquet
  - data/manifests/dns_datasets_fullband.noise_fullband.freesound_000.tar.parquet
  - data/manifests/mad.parquet
  - data/manifests/gunshots.parquet
  - data/manifests/drone.parquet
  - data/manifests/noisex92.parquet
  mix:
    impulse_kinds:
    - blast
    - blast
    - burst
    - click_train
    impulse_peak_db:
    - 15
    - 45
    impulse_room: true
    overload_softclip: true
    speech_rms_db:
    - -32
    - -18
device: cuda
dsp:
  blocking: true
  controller:
    block_margin_db: 10.0
    diff_jump_max_db: 3.0
  limiter: true
init_from: runs/r6_e256/best.pt
init_sha256: 7e0c4dbbed8b4af3e3f06804147661f8246d34a9a0586ba0c2c2b97f059bb425
early_stopping:
  min_delta: 0.0
  patience: null
epochs: 64
loss: hybrid
loss_cfg:
  p: 0.5
  snr_max_db: 30
  w_complex: 50
  w_mag: 50
  w_snr: 0.2
model: vaani
model_cfg:
  channels: 16
  coh: true
  df_order: 3
  film: false
  noise_floor: false
name: r7_e256_wr64
num_workers: auto
optim:
  clip: 5.0
  clip_df: 1.0
  lr: 0.00025
  lr_df: 0.0025
  lr_new: 0.0005
  warmup: 200
resume: true
seed: 1
val:
  dynamic_items: 200
  eval_root: data/eval_r2
  split: val
