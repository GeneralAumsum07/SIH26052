# r8 refvalid C16 on mixer-v2 data (plan 11.6): the full-schedule family-gate competitor and fallback Mini.
# = configs/retraining/r8_mini_refvalid.yaml (r7 recipe + ref_validity + M9 faults + ref_policy, warm start from r7
# best, pinned sha256) with mixer v2, the v2 manifests, the held-out exclusion, EMA and composite selection, so the
# family gate compares models under the same data and the same selection rule. Loss stays r7's hybrid (warm start).
# Exposure: 320 epochs x 20,000 items = 6.4 M items = 200,000 steps at B 32, equal to r8_fe_mini (fixed-exposure
# comparison, spec 8); the r7 init adds r7's own ~7,111 h before this. Not launched here.
# TBD (Rachit, plan 11.9 Q2): NLMS in the default path. Here it runs (the C16 model reads n_hat), robust kernel.
# TBD (plan 11.9 Q7): the selection metric; composite by default, val.select: stoi reverts to r7's rule.
amp: true
batch_size: 32
controller_on: true
data:
  bank: data/rirs/bank_r3.npz
  crop_s: 4.0
  epoch_len: 20000
  exclude_groups_file: configs/data/r8_heldout_exclude.json
  manifests:
  - data/manifests/librispeech_100h.parquet
  - data/manifests/ears.parquet
  - data/manifests/cv_hi.parquet
  - data/manifests/esc50.parquet
  - data/manifests/dns_datasets_fullband.noise_fullband.freesound_000.tar.parquet
  - data/manifests/mad_v2.parquet
  - data/manifests/gunshots.parquet
  mix:
    impulse_kinds:
    - blast
    - blast
    - burst
    - click_train
    v2:
      tail_share: 0.25
    version: 2
  ref_corrupt:
    p: 0.15
    p_absent: 0.15
device: cuda
dsp:
  blocking: true
  controller:
    block_margin_db: 10.0
    diff_jump_max_db: 3.0
  limiter: true
  ref_policy:
    absent: freeze
    nlms: true
    ramp_frames: 12
early_stopping:
  min_delta: 0.0
  patience: null
ema:
  decay: 0.999
  warmup: true
epochs: 320
init_from: results_r2/runs/r7_e256_wr64/best.pt
init_sha256: 0bea98181cf7846d64fdd14e6fc16ec9d45c0028d5feb08f76279f5947b81106
loss: hybrid
loss_cfg:
  p: 0.5
  snr_max_db: 30
  w_complex: 50
  w_mag: 50
  w_snr: 0.2
model: vaani
model_cfg:
  channels: 16
  coh: true
  df_order: 3
  film: false
  noise_floor: false
  ref_validity: true
name: r8_refvalid_v2
num_workers: auto
optim:
  clip: 5.0
  clip_df: 1.0
  lr: 0.00025
  lr_df: 0.0025
  lr_new: 0.0005
  warmup: 200
resume: true
seed: 2
val:
  composite:
    every: 4
    per_bucket: 2
  dynamic_items: 200
  eval_root: data/eval_r2
  select: composite
  split: val
