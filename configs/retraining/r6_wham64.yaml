# r6 arm: control manifests + WHAM! tr (58 h, ~55x DEMAND's volume of real two-channel noise).
# Run SEPARATELY from the DEMAND arm on purpose: wave 4 failed to be informative because four changes
# were bundled and the null could not be attributed. WHAM!'s binaural rig (~17 cm, coherence null
# ~1009 Hz) does not match this rig (12 cm, 1441 Hz) - that mismatch is the experiment. Expect
# stationarity_class() to label most of it 'changing': this tests inter-channel realism, NOT the
# stationary weakness. NC licence - see docs/licences.md. Decision rule: PROTOCOL.md 5.
amp: true
batch_size: 32
controller_on: true
data:
  bank: data/rirs/bank_r3.npz
  crop_s: 4.0
  epoch_len: 20000
  manifests:
  - data/manifests/librispeech_100h.parquet
  - data/manifests/ears.parquet
  - data/manifests/cv_hi.parquet
  - data/manifests/esc50.parquet
  - data/manifests/dns_datasets_fullband.noise_fullband.freesound_000.tar.parquet
  - data/manifests/mad.parquet
  - data/manifests/gunshots.parquet
  - data/manifests/drone.parquet
  - data/manifests/noisex92.parquet
  - data/manifests/wham.parquet
  mix:
    impulse_kinds:
    - blast
    - blast
    - burst
    - click_train
    impulse_peak_db:
    - 15
    - 45
    impulse_room: true
    overload_softclip: true
    speech_rms_db:
    - -32
    - -18
device: cuda
dsp:
  blocking: true
  controller:
    block_margin_db: 10.0
    diff_jump_max_db: 3.0
  limiter: true
early_stopping:
  min_delta: 0.0
  patience: null
epochs: 64
loss: hybrid
loss_cfg:
  p: 0.5
  snr_max_db: 30
  w_complex: 50
  w_mag: 50
  w_snr: 0.2
model: vaani
model_cfg:
  channels: 16
  coh: true
  df_order: 3
  film: false
  noise_floor: false
name: r6_wham64
num_workers: auto
optim:
  clip: 5.0
  clip_df: 1.0
  lr: 0.00025
  lr_df: 0.0025
  lr_new: 0.0005
  warmup: 200
resume: true
seed: 0
val:
  dynamic_items: 200
  eval_root: data/eval_r2
  split: val
