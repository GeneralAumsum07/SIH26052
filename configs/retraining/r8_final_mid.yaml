# Final time-boxed run (2026-10-05): the Arm B Mini recipe (r8_ld_fe_mini_armb.yaml) on the mid tier, Arm B contract (L = 10 ms).
# max_steps is a placeholder: scripts/final_launch.sh times the box and rewrites it so the cosine decays inside the window.
amp: true
batch_size: 32
controller_on: true
data:
  bank: data/rirs/bank_r8.npz
  crop_s: 4.0
  epoch_len: 20000
  exclude_groups_file: configs/data/r8_heldout_exclude.json
  manifests:
  - data/manifests/librispeech_100h.parquet
  - data/manifests/ears.parquet
  - data/manifests/cv_hi.parquet
  - data/manifests/esc50.parquet
  - data/manifests/dns_datasets_fullband.noise_fullband.freesound_000.tar.parquet
  - data/manifests/mad_v2.parquet
  - data/manifests/gunshots.parquet
  - data/manifests/demand_pairs.parquet
  - data/manifests/avq_drone.parquet
  - data/manifests/c3gd.parquet
  - data/manifests/fsd50k.parquet
  - data/manifests/lombard_grid.parquet
  mix:
    impulse_kinds:
    - blast
    - blast
    - burst
    - click_train
    v2:
      tail_share: 0.4
    version: 2
  ref_corrupt:
    p: 0.15
    p_absent: 0.15
device: cuda
dsp:
  limiter: true
  limiter_kernel: numba
  ref_policy:
    absent: freeze
    ramp_samples: 3072
early_stopping:
  min_delta: 0.0
  patience: null
ema:
  decay: 0.999
  warmup: true
epochs: 320
max_steps: 100000
concurrent_runs: 2
loss: fe
loss_cfg:
  kappa: 3.0
  loss_domain: resynthesis
  pesq_filters: fft
  pesq_required: true
  w_consistency: 0.0
  w_mrstft: 0.0
  w_pesq: 0.001
  w_phase: 0.0
model: vaani_fe
model_cfg:
  audio_contract: vaanife_ld_asym512_h128_s160_v1
  df_bins: 144
  df_lags:
  - 0
  - 2
  - 4
  df_taps: 3
  fp32_islands: true
  freq_windows: p32
  gru_init: tc_matched
  inputs: pr
  mask: unbounded
  norm: bn
  tier: mid
  valid_bias: true
name: r8_final_mid
num_workers: auto
optim:
  clip: 5.0
  lr: 0.0005
  warmup: 2000
perf:
  numerics:
    compile: true
    cuda_graph: true
    gru_kernel: fused
    render: cpu
  ops:
    priority: 2
    scorer: inline
    stream: local
resume: true
seed: 0
val:
  composite:
    every: 4
    per_bucket: 2
  dynamic_items: 200
  eval_root: data/eval_r2
  select: composite
  split: val
