# Round 4: e32 (32 epochs, the only r3 ablation that moved: +0.6 dB) continued from its best checkpoint with the
# 3d optimizer groups and the wave-4 corpora: DNS audioset_000-006 + freesound_001 (+157 h, all already on the box), Cadre gunshots
# (crest-audited, 1.2 h), DEMAND measured two-mic pairs.
amp: true
batch_size: 32
controller_on: true
data:
  bank: data/rirs/bank_r3.npz
  crop_s: 4.0
  epoch_len: 20000
  manifests:
  - data/manifests/librispeech_100h.parquet
  - data/manifests/ears.parquet
  - data/manifests/cv_hi.parquet
  - data/manifests/esc50.parquet
  - data/manifests/dns_datasets_fullband.noise_fullband.freesound_000.tar.parquet
  - data/manifests/mad.parquet
  - data/manifests/gunshots.parquet
  - data/manifests/drone.parquet
  - data/manifests/noisex92.parquet
  - data/manifests/dns_datasets_fullband.noise_fullband.audioset_000.tar.parquet
  - data/manifests/dns_datasets_fullband.noise_fullband.audioset_001.tar.parquet
  - data/manifests/dns_datasets_fullband.noise_fullband.audioset_002.tar.parquet
  - data/manifests/dns_datasets_fullband.noise_fullband.audioset_003.tar.parquet
  - data/manifests/dns_datasets_fullband.noise_fullband.audioset_004.tar.parquet
  - data/manifests/dns_datasets_fullband.noise_fullband.audioset_005.tar.parquet
  - data/manifests/dns_datasets_fullband.noise_fullband.audioset_006.tar.parquet
  - data/manifests/dns_datasets_fullband.noise_fullband.freesound_001.tar.parquet
  - data/manifests/cadre.parquet
  - data/manifests/demand.parquet
  mix:
    impulse_kinds:
    - blast
    - blast
    - burst
    - click_train
    impulse_peak_db:
    - 15
    - 45
    impulse_room: true
    overload_softclip: true
    speech_rms_db:
    - -32
    - -18
device: cuda
dsp:
  blocking: true
  controller:
    block_margin_db: 10.0
    diff_jump_max_db: 3.0
  limiter: true
epochs: 32
init_from: runs/vaani_full_r3_e32/best.pt
loss: hybrid
loss_cfg:
  p: 0.5
  snr_max_db: 30
  w_complex: 50
  w_mag: 50
  w_snr: 0.2
model: vaani
model_cfg:
  coh: true
  df_order: 3
  film: false
name: vaani_full_r4
num_workers: 6
optim:
  clip: 5.0
  lr: 0.00025
  lr_new: 0.0005
  warmup: 200
  lr_df: 0.0025
  clip_df: 1.0
seed: 0
val:
  dynamic_items: 200
